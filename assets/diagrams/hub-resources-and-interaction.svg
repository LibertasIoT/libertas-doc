<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="title description">
  <title id="title">Hub resources and shared interaction</title>
  <desc id="description">Human users through clients, AI and cooperating applications share typed interaction with the Hub. The Hub manages application descriptions, message routing, task execution and computing, identities and permissions, and persistent data. Devices and services connect through the Hub. This diagram shows logical roles; participants may share a Hub.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#405a75" stroke-width="1.6"/></marker>
  </defs>
  <rect width="520" height="720" rx="16" fill="#f5f8fc"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172c43">
    <g fill="#ffffff" stroke="#a4b9cd" stroke-width="2">
      <rect x="15" y="20" width="150" height="92" rx="10"/>
      <rect x="185" y="20" width="150" height="92" rx="10"/>
      <rect x="355" y="20" width="150" height="92" rx="10"/>
    </g>
    <g font-size="22" font-weight="700">
      <text x="90" y="56">Humans</text>
      <text x="260" y="56">AI</text>
      <text x="430" y="56">Apps</text>
    </g>
    <g font-size="20" fill="#334c66">
      <text x="90" y="86">via clients</text>
      <text x="260" y="86">via tools</text>
      <text x="430" y="86">via Endpoints</text>
    </g>
    <path d="M90 114 V136 H430 V114" fill="none" stroke="#405a75" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M260 114 V143" fill="none" stroke="#405a75" stroke-width="2.5" marker-start="url(#arrow)"/>
    <path d="M260 178 V188" fill="none" stroke="#405a75" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="260" y="170" font-size="21" fill="#334c66">Shared typed interaction</text>
    <rect x="30" y="195" width="460" height="392" rx="16" fill="#e8f0ff" stroke="#557fc1" stroke-width="2"/>
    <text x="260" y="236" font-size="28" font-weight="700">Libertas Hub</text>
    <g fill="#ffffff" stroke="#a4b9cd" stroke-width="1.5">
      <rect x="50" y="260" width="420" height="48" rx="8"/>
      <rect x="50" y="322" width="420" height="48" rx="8"/>
      <rect x="50" y="384" width="420" height="48" rx="8"/>
      <rect x="50" y="446" width="420" height="48" rx="8"/>
      <rect x="50" y="508" width="420" height="48" rx="8"/>
    </g>
    <g font-size="23">
      <text x="260" y="292">Application descriptions</text>
      <text x="260" y="354">Message handling and routing</text>
      <text x="260" y="416">Task runtime · Computing</text>
      <text x="260" y="478">Identities · Permissions</text>
      <text x="260" y="540">Persistent data</text>
    </g>
    <path d="M260 595 V635" fill="none" stroke="#405a75" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="80" y="645" width="360" height="55" rx="10" fill="#ffffff" stroke="#a4b9cd" stroke-width="2"/>
    <text x="260" y="681" font-size="23" font-weight="700">Devices and services</text>
  </g>
</svg>
